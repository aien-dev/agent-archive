[package]
name = "agent-archive"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Central archive of every AI agent chat on the Spark"

[dependencies]
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"

[profile.release]
opt-level = 3
strip = true
